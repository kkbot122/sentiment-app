apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-analytics
  labels:
    app: sentiment-analytics
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: analytics
  template:
    metadata:
      labels:
        tier: analytics
        app: sentiment-analytics
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
